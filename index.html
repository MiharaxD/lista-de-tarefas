<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/script.js" defer></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
    <title>Lista de Tarefas</title>
</head>

<body>
    <main class="app-container">
        <header class="app-header">
            <div>
                <h1>Lista de Tarefas</h1>
                <p id="current-date">Sua lista de hoje</p>
            </div>
            <span class="counter" id="task-counter">0</span>
        </header>
        <form id="todo-form" class="todo-form">
            <input type="text" id="todo-input" placeholder="adicione uma nova tarefa..." required autocomplete="off">
            <button type="submit" class="btn"><i class="ph ph-plus"></i></button>
        </form>
        <ul id="todo-list" class="todo-list">

        </ul>
    </main>
</body>

</html>
